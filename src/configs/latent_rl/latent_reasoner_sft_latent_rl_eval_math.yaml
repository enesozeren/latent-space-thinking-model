# Model configuration
model:
  base_model_name_or_path: "outputs/latent_reasoner_1p5b_sft_latent_rl/20250827_180422/checkpoint_epoch_0"
  is_latent_reasoner: True  # Set to true for latent reasoner evaluation
  num_latent_steps: 6  # Number of latent steps

# Dataset configuration
dataset:
  dataset: "HuggingFaceH4/MATH-500"  # choices: ["openai/gsm8k", "HuggingFaceH4/MATH-500"]
  split: "test"            # choices: ["test", "train"]
  num_examples: null       # null means use all examples, or specify a number

# Generation parameters
generation:
  temperature: 0.2
  top_p: 0.95
  max_length: 2048
  batch_size: 1

# Output configuration
logs:
  output_dir: "outputs"
  wandb_project: "latent_reasoner_eval"
  wandb_run_name: latent_reasoner_1p5b_sft_latent_rl_MATH-500_eval
  no_wandb: false

# Reproducibility
seed: 42