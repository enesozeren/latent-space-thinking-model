model:
  model_name: "LatentReasoner"
  base_model_name_or_path: "Qwen/Qwen2.5-1.5B"
  is_latent_reasoner: True

dataset:
  name: "openai/gsm8k" # Only works with this dataset

training:
  seed: 42
  dataset_refresh_every_n_steps: 20 # Refresh dataset for every n steps for incremental latent thinking
  add_num_latents_per_update: 4
  num_tokens_per_latent: 4
  output_dir: "/dss/dssmcmlfs01/pr74ze/pr74ze-dss-0001/ra32qov2/latent_reasoner_storage/outputs/latent_reasoner_1p5b_sft"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  lr_scheduler_gamma: 0.9
  learning_rate: 1.0e-5
  lr_scheduler_step_size: 20
  num_train_epochs: 10
  logging_steps: 1
  eval_steps: 128
  weight_decay: 0.01

wandb:
  project: latent_reasoner_sft
  run_name: latent_reasoner_1p5b_sft