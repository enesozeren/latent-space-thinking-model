model:
  model_name_or_path: "google/gemma-3-1b-it"

dataset:
  name: "zwhe99/DeepMath-103K" # Only works with this dataset

training:
  seed: 42
  output_dir: "outputs/gemma_3_1b_it_rl"
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  lr_scheduler_type: "cosine_with_min_lr"
  learning_rate: 1.0e-6
  lr_scheduler_kwargs: 
    min_lr_rate: 0.1
  num_train_epochs: 1
  logging_steps: 1
  eval_steps: 200
  save_steps: 200
  warmup_steps: 20
  weight_decay: 0.01

grpo:
  # Core GRPO hyperparameters
  beta: 0.04  # KL penalty coefficient
  epsilon: 0.2  # clip range
  scale_rewards: true
  
  # Generation parameters
  num_generations: 6  # Number of answers to generate for each input
  max_completion_length: 2048  # Maximum length of the generated answer
  temperature: 0.7

wandb:
  project: latent_reasoner
  run_name: gemma_3_1b_it_rl_deepmath