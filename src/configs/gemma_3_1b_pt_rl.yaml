model:
  model_name_or_path: "google/gemma-3-1b-pt"

dataset:
  name: "zwhe99/DeepMath-103K" # Only works with this dataset

training:
  seed: 42
  output_dir: "/dss/dssmcmlfs01/pr74ze/pr74ze-dss-0001/ra32qov2/latent_reasoner_storage/outputs/gemma_3_1b_pt_rl"
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 2
  logging_steps: 1
  eval_steps: 200
  save_steps: 200
  warmup_steps: 1
  weight_decay: 0.01

grpo:
  # Core GRPO hyperparameters
  beta: 0.04  # KL penalty coefficient
  epsilon: 0.2  # clip range
  scale_rewards: true
  
  # Generation parameters
  num_generations: 8  # Number of answers to generate for each input
  max_completion_length: 1024  # Maximum length of the generated answer
  temperature: 0.7

wandb:
  project: latent_reasoner
  run_name: gemma_3_1b_pt_rl_deepmath