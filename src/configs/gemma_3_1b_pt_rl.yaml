model:
  model_name_or_path: "google/gemma-3-1b-pt"

dataset:
  name: "openai/gsm8k"
  subname: "main"

training:
  output_dir: "outputs/gemma_3_1b_rl"
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  max_steps: 2000
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  warmup_steps: 100
  weight_decay: 0.01

grpo:
  # Core GRPO hyperparameters
  beta: 0.04  # KL penalty coefficient
  epsilon: 0.2  # clip range
  scale_rewards: true
  
  # Generation parameters
  num_generations: 8  # Number of answers to generate for each input
  max_completion_length: 1024  # Maximum length of the generated answer
  temperature: 0.9
